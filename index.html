<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TwoB - Fluxo Caixa</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fbf8ed',
                            500: '#d4af37', // Dourado 2B
                            600: '#b89028',
                            900: '#1a150a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .active-tab { background-color: #d4af37 !important; color: #020617 !important; font-weight: 800 !important; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 pb-20 md:pb-6">

    <!-- Cabeçalho -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <img src="https://i.ibb.co/WWKdFNmr/Whats-App-Image-2026-05-14-at-11-21-25.jpg" alt="Logo TwoB" class="h-12 w-auto object-contain rounded bg-black p-1 border border-brand-500/40 shadow-md">
                <div>
                    <h1 class="text-sm sm:text-base font-black text-white tracking-tight flex items-center gap-2">
                        TwoB - Fluxo Caixa
                    </h1>
                    <span id="role-badge" class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-400">
                        <i class="fa-solid fa-database text-[9px]"></i> <span id="status-text">Conectado ao Supabase</span>
                    </span>
                </div>
            </div>

            <!-- Navegação Desktop -->
            <nav class="hidden md:flex items-center space-x-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('lancar')" id="desk-tab-lancar" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 active-tab">
                    <i class="fa-solid fa-circle-plus"></i> + Lançar
                </button>
                <button onclick="switchTab('extrato')" id="desk-tab-extrato" class="px-3.5 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul"></i> Extrato / Caixa
                </button>
            </nav>
        </div>
    </header>

    <!-- Menu Mobile (Rodapé) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 z-50 flex justify-around py-2 px-3 backdrop-blur-lg">
        <button onclick="switchTab('lancar')" id="mob-tab-lancar" class="flex flex-col items-center gap-1 text-brand-500 font-extrabold text-[10px]">
            <i class="fa-solid fa-circle-plus text-lg"></i><span>+ Lançar</span>
        </button>
        <button onclick="switchTab('extrato')" id="mob-tab-extrato" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-[10px]">
            <i class="fa-solid fa-receipt text-lg"></i><span>Extrato</span>
        </button>
    </div>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-3 sm:px-6 py-4 space-y-4">

        <!-- ABA 1: LANÇAR MOVIMENTAÇÃO -->
        <div id="view-lancar" class="space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-brand-500"></i> <span id="form-title">Lançamento de Caixa</span>
                    </h2>
                    <span class="text-[10px] text-slate-400 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">Banco de Dados Cloud</span>
                </div>

                <input type="hidden" id="in-id" value="">
                <input type="hidden" id="in-tipo" value="entrada">

                <!-- Seletor Tipo -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setMovementType('entrada')" id="btn-type-entrada" class="py-2.5 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                        <i class="fa-solid fa-arrow-down"></i> Entrada (+)
                    </button>
                    <button type="button" onclick="setMovementType('saida')" id="btn-type-saida" class="py-2.5 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400 border border-slate-800">
                        <i class="fa-solid fa-arrow-up"></i> Saída (-)
                    </button>
                </div>

                <!-- Campos Data e Valor -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Data da Movimentação</label>
                        <input type="date" id="in-data" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Valor (R$)</label>
                        <input type="number" id="in-valor" step="0.01" placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm font-black text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <!-- Descrição e Categoria -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Descrição / Histórico</label>
                    <input type="text" id="in-descricao" placeholder="Ex: Comissão Cury Bosque da Barra" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Categoria</label>
                        <select id="in-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-medium"></select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">Cód. Proposta (PV) ou NF-e</label>
                        <input type="text" id="in-ref-code" placeholder="Ex: PV-395473 ou NF-000102" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-amber-400 font-mono focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <!-- Upload de Comprovante -->
                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                    <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-paperclip text-brand-500"></i> Anexar Comprovante / PDF
                    </label>
                    <input type="file" id="in-file" accept="image/*,application/pdf" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-500/20 file:text-brand-500">
                </div>

                <div class="flex gap-2">
                    <button onclick="saveTransaction()" class="flex-grow bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 text-slate-950 font-black py-3 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-base"></i> <span id="btn-save-label">Salvar no Supabase</span>
                    </button>
                    <button onclick="resetForm()" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 rounded-xl text-xs">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>

        <!-- ABA 2: EXTRATO (COM TOTAIS NO TOPO E FILTROS COMPLETOS) -->
        <div id="view-extrato" class="space-y-4 hidden">

            <!-- Quadros de Totais e Saldo Líquido no Topo -->
            <div class="grid grid-cols-3 gap-2 sm:gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 sm:p-4 text-center sm:text-left shadow-lg">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase block mb-0.5">Entradas</span>
                    <div class="text-sm sm:text-xl font-black text-emerald-400" id="card-total-entradas">R$ 0,00</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 sm:p-4 text-center sm:text-left shadow-lg">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase block mb-0.5">Saídas</span>
                    <div class="text-sm sm:text-xl font-black text-rose-400" id="card-total-saidas">R$ 0,00</div>
                </div>
                <div class="bg-slate-900 border border-brand-500/40 rounded-xl p-3 sm:p-4 text-center sm:text-left shadow-lg bg-gradient-to-br from-slate-900 to-brand-950/30">
                    <span class="text-[10px] font-semibold text-brand-500 uppercase block mb-0.5">Saldo Líquido</span>
                    <div class="text-sm sm:text-xl font-black text-white" id="card-saldo-liquido">R$ 0,00</div>
                </div>
            </div>

            <!-- Painel de Busca e Filtros de Período -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-3 shadow-lg">
                <!-- Botões Rápidos de Período -->
                <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                    <button onclick="setFilterPeriod('hoje')" id="btn-period-hoje" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">Dia (Hoje)</button>
                    <button onclick="setFilterPeriod('mes_atual')" id="btn-period-mes_atual" class="px-3 py-1 rounded-lg text-xs font-semibold bg-brand-500 text-slate-950 whitespace-nowrap shadow">Este Mês</button>
                    <button onclick="setFilterPeriod('mes_anterior')" id="btn-period-mes_anterior" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">Mês Anterior</button>
                    <button onclick="setFilterPeriod('ano')" id="btn-period-ano" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">Ano 2026</button>
                    <button onclick="setFilterPeriod('todos')" id="btn-period-todos" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 whitespace-nowrap">Todos</button>
                </div>

                <!-- Filtro por Intervalo de Datas e Campo de Busca -->
                <div class="flex flex-col sm:flex-row items-center gap-2">
                    <div class="flex items-center gap-1.5 w-full sm:w-auto text-xs">
                        <input type="date" id="filter-date-start" onchange="renderApp()" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white w-full">
                        <span class="text-slate-500 font-bold">até</span>
                        <input type="date" id="filter-date-end" onchange="renderApp()" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white w-full">
                    </div>
                    <div class="relative w-full">
                        <input type="text" id="search-input" placeholder="Buscar por descrição, PV, NF ou categoria..." oninput="renderApp()" 
                               class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500">
                        <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-slate-500 text-[11px]"></i>
                    </div>
                </div>
            </div>

            <!-- Lista Dinâmica Estilo App Bancário -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="p-3 border-b border-slate-800 text-xs font-bold text-brand-500 uppercase flex items-center justify-between">
                    <span><i class="fa-solid fa-list-ul"></i> Extrato de Transações</span>
                    <span class="text-[10px] text-slate-400 font-normal">Estilo Bancário</span>
                </div>
                <div class="divide-y divide-slate-800/60" id="tb-caixa-body"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
