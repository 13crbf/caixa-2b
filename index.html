<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TwoB Imobiliária - Fluxo de Caixa Pro</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        darkbg: '#0D1117',
                        cardbg: '#161B22',
                        cardborder: '#30363D',
                        textprimary: '#F0F6FC',
                        textsecondary: '#8B949E',
                        positive: '#2EA043',
                        negative: '#FF6B6B',
                        brand: {
                            500: '#D4AF37',
                            600: '#B89028',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0D1117; color: #F0F6FC; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0D1117; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363D; border-radius: 4px; }
        .bottom-sheet-backdrop { transition: opacity 0.3s ease-in-out; }
        .bottom-sheet-panel { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .bottom-sheet-hidden { transform: translateY(100%); }
        .bottom-sheet-visible { transform: translateY(0); }
        .pill-active { background-color: #D4AF37 !important; color: #0D1117 !important; font-weight: 700 !important; }
        select option { background-color: #161B22; color: #F0F6FC; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-darkbg text-textprimary pb-24 md:pb-8">

    <!-- CABEÇALHO COM LOGO REDONDO ESTILO INSTAGRAM -->
    <header class="bg-[#161B22]/90 border-b border-cardborder sticky top-0 z-30 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <img src="https://i.ibb.co/WWKdFNmr/Whats-App-Image-2026-05-14-at-11-21-25.jpg" alt="Logo TwoB" class="h-10 w-10 object-cover rounded-full border-2 border-brand-500 shadow-md">
                <div>
                    <h1 class="text-sm sm:text-base font-extrabold text-white tracking-tight leading-tight">TwoB Imobiliária</h1>
                    <p class="text-[11px] text-textsecondary font-medium" id="header-subtitle">Fluxo de Caixa & Extrato</p>
                </div>
            </div>

            <!-- Navegação Desktop -->
            <nav class="hidden md:flex items-center space-x-1 bg-darkbg p-1 rounded-xl border border-cardborder">
                <button id="desk-tab-extrato" class="px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 pill-active">
                    <i class="fa-solid fa-receipt"></i> Extrato
                </button>
                <button id="desk-tab-lancar" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-textsecondary hover:text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-plus"></i> + Lançar
                </button>
                <button id="desk-tab-corretores" class="px-4 py-1.5 rounded-lg text-xs font-semibold text-textsecondary hover:text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-user-tie"></i> Corretores
                </button>
            </nav>
        </div>
    </header>

    <!-- MENU MOBILE (RODAPÉ FIXO) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#161B22]/95 border-t border-cardborder z-40 flex justify-around py-2.5 px-4 backdrop-blur-lg">
        <button id="mob-tab-extrato" class="flex flex-col items-center gap-1 text-brand-500 font-bold text-[11px]">
            <i class="fa-solid fa-receipt text-lg"></i><span>Extrato</span>
        </button>
        <button id="mob-tab-lancar" class="flex flex-col items-center gap-1 text-textsecondary font-medium text-[11px]">
            <i class="fa-solid fa-circle-plus text-lg"></i><span>+ Lançar</span>
        </button>
        <button id="mob-tab-corretores" class="flex flex-col items-center gap-1 text-textsecondary font-medium text-[11px]">
            <i class="fa-solid fa-user-tie text-lg"></i><span>Corretores</span>
        </button>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-3 sm:px-6 py-4 space-y-4">

        <!-- ABA 1: EXTRATO BANCÁRIO -->
        <div id="view-extrato" class="space-y-4">
            <!-- CARDS DE SALDO TOTAL -->
            <div class="bg-cardbg border border-cardborder rounded-2xl p-4 sm:p-5 shadow-xl">
                <div class="flex items-center justify-between border-b border-cardborder/60 pb-3 mb-3">
                    <span class="text-xs font-bold text-textsecondary uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-wallet text-brand-500"></i> Saldo Corporativo
                    </span>
                    <button id="btn-toggle-eye" class="text-textsecondary hover:text-white transition p-1.5 rounded-lg bg-darkbg border border-cardborder text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-eye" id="eye-icon"></i> <span id="eye-text" class="text-[10px] hidden sm:inline font-semibold">Ocultar</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                    <div>
                        <span class="text-[11px] font-semibold text-textsecondary block mb-0.5">Saldo Líquido Disponível</span>
                        <div class="text-2xl sm:text-3xl font-black text-white tracking-tight" id="val-saldo-liquido">R$ 0,00</div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-2 md:pt-0 md:col-span-2 border-t md:border-t-0 md:border-l border-cardborder/60 md:pl-4">
                        <div class="bg-darkbg/70 p-2.5 rounded-xl border border-cardborder/40">
                            <span class="text-[10px] font-bold text-positive uppercase block mb-0.5 flex items-center gap-1">
                                <i class="fa-solid fa-circle-arrow-down text-[10px]"></i> Entradas
                            </span>
                            <div class="text-sm sm:text-base font-extrabold text-positive" id="val-total-entradas">R$ 0,00</div>
                        </div>
                        <div class="bg-darkbg/70 p-2.5 rounded-xl border border-cardborder/40">
                            <span class="text-[10px] font-bold text-negative uppercase block mb-0.5 flex items-center gap-1">
                                <i class="fa-solid fa-circle-arrow-up text-[10px]"></i> Saídas
                            </span>
                            <div class="text-sm sm:text-base font-extrabold text-negative" id="val-total-saidas">R$ 0,00</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FILTROS (DROPDOWNS DIA/MÊS/ANO + BUSCA) -->
            <div class="bg-cardbg border border-cardborder rounded-2xl p-3.5 space-y-3 shadow-lg">
                <div class="space-y-2">
                    <div class="relative w-full">
                        <input type="text" id="search-input" placeholder="Buscar por categoria ou documento..." 
                               class="w-full bg-darkbg border border-cardborder rounded-xl pl-9 pr-3 py-2 text-xs text-textprimary focus:outline-none focus:border-brand-500 placeholder-textsecondary">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-textsecondary text-xs"></i>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <select id="filter-dia" class="w-full bg-darkbg border border-cardborder rounded-xl px-2.5 py-1.5 text-xs text-textprimary font-medium focus:outline-none focus:border-brand-500">
                            <option value="">Dia: Todos</option>
                        </select>
                        <select id="filter-mes" class="w-full bg-darkbg border border-cardborder rounded-xl px-2.5 py-1.5 text-xs text-textprimary font-medium focus:outline-none focus:border-brand-500">
                            <option value="">Mês: Todos</option>
                            <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option>
                            <option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option>
                            <option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                        </select>
                        <select id="filter-ano" class="w-full bg-darkbg border border-cardborder rounded-xl px-2.5 py-1.5 text-xs text-textprimary font-medium focus:outline-none focus:border-brand-500">
                            <option value="">Ano: Todos</option>
                            <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- CONTAINER DE TRANSAÇÕES AGRUPADAS COM SALDO MOMENTÂNEO -->
            <div id="transactions-grouped-container" class="space-y-4"></div>
        </div>

        <!-- ABA 2: LANÇAR MOVIMENTAÇÃO -->
        <div id="view-lancar" class="space-y-4 hidden">
            <div class="bg-cardbg border border-cardborder rounded-2xl p-4 sm:p-6 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-cardborder pb-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-brand-500"></i> <span id="form-title">Nova Movimentação</span>
                    </h2>
                </div>

                <input type="hidden" id="in-id" value="">
                <input type="hidden" id="in-tipo" value="entrada">

                <!-- Seletor Entrada/Saída -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btn-type-entrada" class="py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 bg-positive/20 text-positive border border-positive/40">
                        <i class="fa-solid fa-arrow-down"></i> Entrada (+)
                    </button>
                    <button type="button" id="btn-type-saida" class="py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 bg-darkbg text-textsecondary border border-cardborder">
                        <i class="fa-solid fa-arrow-up"></i> Saída (-)
                    </button>
                </div>

                <!-- Campos Básicos Enxutos: Data, Valor e Categoria -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">Data</label>
                        <input type="date" id="in-data" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">Valor (R$)</label>
                        <input type="number" id="in-valor" step="0.01" placeholder="0,00" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2.5 text-sm font-black text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-textsecondary mb-1">Categoria</label>
                    <select id="in-categoria" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-medium"></select>
                </div>

                <!-- Campo Dinâmico de Vínculo de Corretor -->
                <div id="container-select-corretor" class="hidden">
                    <label class="block text-[11px] font-bold text-brand-500 mb-1">Vincular Corretor Beneficiário</label>
                    <select id="in-corretor-id" class="w-full bg-darkbg border border-brand-500/50 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500 font-medium"></select>
                </div>

                <div class="flex gap-2 pt-2">
                    <button id="btn-save-tx" class="flex-grow bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 text-darkbg font-black py-3 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check text-base"></i> <span id="btn-save-label">Salvar Lançamento</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ABA 3: CADASTRO DE CORRETORES -->
        <div id="view-corretores" class="space-y-4 hidden">
            <div class="bg-cardbg border border-cardborder rounded-2xl p-4 sm:p-6 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-cardborder pb-3">
                    <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-brand-500"></i> Cadastrar Novo Corretor
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">Nome Completo</label>
                        <input type="text" id="cor-nome" placeholder="Ex: Roberto Alves" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="cor-telefone" placeholder="(11) 99999-9999" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">CRECI</label>
                        <input type="text" id="cor-creci" placeholder="123456-F" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-textsecondary mb-1">CPF</label>
                        <input type="text" id="cor-cpf" placeholder="000.000.000-00" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-textsecondary mb-1">Chave Pix</label>
                    <input type="text" id="cor-pix" placeholder="E-mail, CPF, Celular ou Aleatória" class="w-full bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <button id="btn-save-corretor" class="w-full bg-brand-500 hover:bg-brand-600 text-darkbg font-bold py-2.5 px-4 rounded-xl text-xs shadow transition">
                    Salvar Corretor
                </button>
            </div>

            <div class="bg-cardbg border border-cardborder rounded-2xl overflow-hidden shadow-xl">
                <div class="p-3 border-b border-cardborder text-xs font-bold text-brand-500 uppercase">
                    Corretores Cadastrados
                </div>
                <div class="divide-y divide-cardborder/40" id="corretores-list-container"></div>
            </div>
        </div>

    </main>

    <!-- BOTTOM SHEET: DETALHES, EDITAR DESCRIÇÃO & ARQUIVOS -->
    <div id="bottom-sheet-backdrop" class="fixed inset-0 bg-black/70 z-50 bottom-sheet-backdrop opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <div id="bottom-sheet-panel" class="fixed bottom-0 left-0 right-0 z-50 bg-cardbg border-t border-cardborder rounded-t-3xl max-w-2xl mx-auto p-4 sm:p-6 shadow-2xl bottom-sheet-panel bottom-sheet-hidden">
        <div class="w-12 h-1.5 bg-cardborder rounded-full mx-auto mb-4"></div>
        <div class="flex items-start justify-between border-b border-cardborder pb-3 mb-4">
            <div class="flex items-center gap-3">
                <div id="bs-icon-badge" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-base shrink-0"></div>
                <div>
                    <h3 class="text-sm sm:text-base font-extrabold text-white" id="bs-category">Categoria</h3>
                    <p class="text-[11px] text-textsecondary font-mono" id="bs-subtitle">Data • Valor</p>
                </div>
            </div>
            <button id="btn-close-bs" class="text-textsecondary hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="space-y-4">
            <!-- Vínculo do Corretor (se houver) -->
            <div id="bs-corretor-box" class="hidden p-3 bg-darkbg border border-brand-500/30 rounded-xl space-y-1">
                <span class="text-[10px] text-brand-500 font-bold uppercase block"><i class="fa-solid fa-user-tie"></i> Corretor Beneficiário</span>
                <div class="text-xs font-bold text-white" id="bs-corretor-nome">--</div>
                <div class="text-[10px] text-textsecondary font-mono" id="bs-corretor-detalhes">--</div>
            </div>

            <!-- Edição de Descrição -->
            <div>
                <label class="block text-[11px] font-bold text-textsecondary mb-1">Adicionar / Editar Descrição</label>
                <div class="flex gap-2">
                    <input type="text" id="bs-in-descricao" placeholder="Ex: Referente a repasse proposta PV-395473" class="flex-grow bg-darkbg border border-cardborder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
                    <button id="btn-update-desc" class="bg-brand-500 hover:bg-brand-600 text-darkbg font-bold px-3 text-xs rounded-xl transition">Salvar</button>
                </div>
            </div>

            <!-- Adicionar e Editar Arquivos -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-textprimary flex items-center justify-between">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-folder-open text-brand-500"></i> Arquivos Vinculados</span>
                </label>
                <input type="file" id="bs-in-file" accept="image/*,application/pdf" class="w-full text-xs text-textsecondary file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-500/20 file:text-brand-500">
                <div id="bs-files-list" class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar pt-1"></div>
            </div>

            <!-- Ações -->
            <div class="pt-2 grid grid-cols-2 gap-2 border-t border-cardborder">
                <button id="bs-btn-edit" class="py-2.5 rounded-xl text-xs font-bold bg-darkbg text-textprimary border border-cardborder hover:border-brand-500 transition">Editar Lançamento</button>
                <button id="bs-btn-delete" class="py-2.5 rounded-xl text-xs font-bold bg-negative/10 text-negative border border-negative/30 hover:bg-negative/20 transition">Excluir</button>
            </div>
        </div>
    </div>

    <!-- CARREGAMENTO DOS MÓDULOS ES6 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
